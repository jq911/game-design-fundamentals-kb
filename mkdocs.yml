site_name: 游戏设计知识库
site_description: 《游戏设计基础（原书第3版）》结构化读书知识库
site_url: https://jq911.github.io/game-design-fundamentals-kb/
repo_url: https://github.com/jq911/game-design-fundamentals-kb
repo_name: jq911/game-design-fundamentals-kb

theme:
  name: material
  custom_dir: overrides
  language: zh
  favicon: assets/icons/Pac-Man.ico
  logo: assets/icons/logo.svg
  icon:
    repo: custom/github-invertocat
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - scheme: slate
      primary: black
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

plugins:
  - search:
      lang:
        - zh
        - en

extra_css:
  - stylesheets/home.css

extra_javascript:
  - javascripts/book-gate.js

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

