site_name: 游戏设计基础知识库
site_description: 《游戏设计基础（原书第3版）》结构化读书知识库
site_url: https://jq911.github.io/game-design-fundamentals-kb/
repo_url: https://github.com/jq911/game-design-fundamentals-kb
repo_name: jq911/game-design-fundamentals-kb

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - 首页: index.md
  - 第 1 章 游戏和电子游戏:
      - 章节导览: 01-游戏和电子游戏/index.md
      - 1.1 游戏是什么: 01-游戏和电子游戏/01-01-游戏是什么.md
      - 1.2 传统游戏与电子游戏: 01-游戏和电子游戏/01-02-传统游戏与电子游戏.md
      - 1.3 游戏的娱乐性: 01-游戏和电子游戏/01-03-游戏的娱乐性.md
      - 1.4 严肃游戏: 01-游戏和电子游戏/01-04-严肃游戏.md
      - 1.5 本章总结: 01-游戏和电子游戏/01-05-本章总结.md
      - 1.6 设计练习——训练: 01-游戏和电子游戏/01-06-设计练习-训练.md
      - 1.7 设计练习——习题: 01-游戏和电子游戏/01-07-设计练习-习题.md
